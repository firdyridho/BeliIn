    <path d="M22 40 L38 49 L54 40" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 50 L38 56 L48 50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Wordmark -->
  <text x="110" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1">
    Anter<tspan fill="#EA580C">In</tspan>
