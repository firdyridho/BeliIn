<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="anterin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>
  <!-- Icon Mark: Speed Delivery Box & Forward Arrow -->
  <g transform="translate(15, 12)">
    <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#anterin-grad)" />
